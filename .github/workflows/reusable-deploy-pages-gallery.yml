name: Reusable — Deploy Pages Gallery

on:
  workflow_call:
    inputs:
      build_script:
        description: Path to the gallery-generation script.
        type: string
        default: .github/scripts/generate_gallery.py
      artifact_path:
        description: Directory to upload as the Pages artifact.
        type: string
        default: docs
      prebuilt_artifact_name:
        description: Name of a prebuilt gallery artifact to download instead of running the build script.
        type: string
        default: ''

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download prebuilt gallery
        if: ${{ inputs.prebuilt_artifact_name != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.prebuilt_artifact_name }}
          path: ${{ inputs.artifact_path }}

      - name: Generate gallery
        if: ${{ inputs.prebuilt_artifact_name == '' }}
        env:
          TP_ALLOW_VENDOR_TOFU: "1"
        run: python3 ${{ inputs.build_script }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ inputs.artifact_path }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
