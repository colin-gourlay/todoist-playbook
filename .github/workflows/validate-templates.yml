name: Validate templates

on:
  push:
    branches: [ main ]
    paths:
      - csv-templates/**
      - prompt-templates/**
      - .github/scripts/generate_release_assets.py
      - .github/scripts/generate_gallery.py
      - .github/scripts/assert_gallery_security.py
      - .github/scripts/vendor-manifest.json
      - .github/scripts/gallery.css
      - .github/scripts/gallery.js
      - .github/workflows/deploy-gallery.yml
      - .github/workflows/reusable-deploy-pages-gallery.yml
      - .github/workflows/release.yml
      - .github/workflows/reusable-release-assets.yml
      - .github/workflows/validate-templates.yml
      - .github/workflows/reusable-validate-templates.yml
      - .github/workflows/reusable-gallery-quality.yml
      - .github/scripts/project_colors.txt
      - .github/quality/**
  pull_request:
    branches: [ main ]
    paths:
      - csv-templates/**
      - prompt-templates/**
      - .github/scripts/generate_release_assets.py
      - .github/scripts/generate_gallery.py
      - .github/scripts/assert_gallery_security.py
      - .github/scripts/vendor-manifest.json
      - .github/scripts/gallery.css
      - .github/scripts/gallery.js
      - .github/workflows/deploy-gallery.yml
      - .github/workflows/reusable-deploy-pages-gallery.yml
      - .github/workflows/release.yml
      - .github/workflows/reusable-release-assets.yml
      - .github/workflows/validate-templates.yml
      - .github/workflows/reusable-validate-templates.yml
      - .github/workflows/reusable-gallery-quality.yml
      - .github/scripts/project_colors.txt
      - .github/quality/**
  workflow_dispatch:
  merge_group:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  
jobs:
  validate:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-validate-templates.yml

  security-checks:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate gallery (TOFU vendor bootstrap)
        env:
          TP_ALLOW_VENDOR_TOFU: "1"
        run: python3 .github/scripts/generate_gallery.py

      - name: Assert gallery security properties
        run: python3 .github/scripts/assert_gallery_security.py docs/index.html

  gallery-quality:
    needs: validate
    if: ${{ success() }}
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-gallery-quality.yml
