name: Validate templates

on:
  push:
    branches: [ main ]
    paths:
      - csv-templates/**
      - prompt-templates/**
      - .github/scripts/generate_release_assets.py
      - .github/workflows/deploy-gallery.yml
      - .github/workflows/reusable-deploy-pages-gallery.yml
      - .github/workflows/release.yml
      - .github/workflows/reusable-release-assets.yml
      - .github/workflows/validate-templates.yml
      - .github/workflows/reusable-validate-templates.yml
      - .github/workflows/reusable-gallery-quality.yml
      - .github/scripts/project_colors.txt
      - .github/scripts/generate_gallery.py
      - .github/quality/**
  pull_request:
    branches: [ main ]
    paths:
      - csv-templates/**
      - prompt-templates/**
      - .github/scripts/generate_release_assets.py
      - .github/workflows/deploy-gallery.yml
      - .github/workflows/reusable-deploy-pages-gallery.yml
      - .github/workflows/release.yml
      - .github/workflows/reusable-release-assets.yml
      - .github/workflows/validate-templates.yml
      - .github/workflows/reusable-validate-templates.yml
      - .github/workflows/reusable-gallery-quality.yml
      - .github/scripts/project_colors.txt
      - .github/scripts/generate_gallery.py
      - .github/quality/**
  workflow_dispatch:
  merge_group:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  
jobs:
  validate:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-validate-templates.yml

  gallery-quality:
    needs: validate
    if: ${{ success() }}
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-gallery-quality.yml

