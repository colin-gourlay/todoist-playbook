name: Sync Template Review Issues

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - csv-templates/**
      - .github/scripts/sync_template_review_issues.py
      - .github/workflows/sync-template-review-issues.yml
  schedule:
    - cron: "0 6 * * *"

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sync review issues from CSV template versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REVIEW_ISSUE_ASSIGNEE: colin-gourlay
        run: python3 .github/scripts/sync_template_review_issues.py
