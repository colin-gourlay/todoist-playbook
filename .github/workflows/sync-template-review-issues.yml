name: Sync Template Review Issues

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - csv-templates/**
      - .github/scripts/sync_template_review_issues.py
      - .github/workflows/sync-template-review-issues.yml
  schedule:
    - cron: "0 6 * * *"

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Sync review issues from CSV template versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REVIEW_ISSUE_ASSIGNEE: colin-gourlay
        run: python3 .github/scripts/sync_template_review_issues.py
