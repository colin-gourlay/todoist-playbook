name: Sync Template Review Issues

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - csv-templates/**
      - .github/scripts/sync_template_review_issues.py
      - .github/workflows/sync-template-review-issues.yml
  schedule:
    - cron: "0 6 * * *"

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Sync review issues from CSV template versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REVIEW_ISSUE_ASSIGNEE: colin-gourlay
        run: python3 .github/scripts/sync_template_review_issues.py
