name: Reusable — Gallery Quality

on:
  workflow_call:
    inputs:
      gallery_dir:
        description: Directory containing the generated gallery.
        type: string
        default: docs

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate gallery
        env:
          TP_ALLOW_VENDOR_TOFU: "1"
        run: python3 .github/scripts/generate_gallery.py

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: '.github/quality/package-lock.json'

      - name: Install quality tools
        run: npm ci --prefix .github/quality

      - name: Start static server
        run: |
          npx --prefix .github/quality http-server ${{ inputs.gallery_dir }} -p 8080 --silent &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV

          sleep 1
          if ! kill -0 "$SERVER_PID" 2>/dev/null; then
            echo "❌ Static server process failed to start"
            exit 1
          fi

          echo "Waiting for server to be ready…"
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080 > /dev/null 2>&1; then
              echo "Server is ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "❌ Server did not respond within 30 seconds"
          exit 1

      - name: Run Lighthouse CI
        continue-on-error: true
        working-directory: .github/quality
        run: |
          npx lhci autorun --config=lighthouserc.json

      - name: Run pa11y-ci
        continue-on-error: true
        run: |
          mkdir -p .github/quality/pa11y-results
          set -o pipefail
          set +e
          npx --prefix .github/quality pa11y-ci --config .github/quality/.pa11yci.json \
            --json | tee .github/quality/pa11y-results/report.json
          PA11Y_EXIT=${PIPESTATUS[0]}
          set -e

          if [ "$PA11Y_EXIT" -ne 0 ]; then
            echo "::warning title=pa11y-ci reported accessibility issues::Non-blocking: see pa11y-report artifact and step summary."
            {
              echo "### pa11y-ci result"
              echo ""
              echo "- Status: issues found (non-blocking)"
              echo "- Artifact: pa11y-report"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### pa11y-ci result"
              echo ""
              echo "- Status: passed"
              echo "- Artifact: pa11y-report"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          exit 0

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-report
          path: .github/quality/.lighthouseci/
          if-no-files-found: warn

      - name: Upload pa11y report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pa11y-report
          path: .github/quality/pa11y-results/
          if-no-files-found: warn

      - name: Stop static server
        if: always()
        run: kill $SERVER_PID || true
