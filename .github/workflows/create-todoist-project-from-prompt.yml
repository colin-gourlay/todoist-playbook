name: Create Todoist Project from Prompt Template

on:
  workflow_dispatch:
    inputs:
      prompt_template:
        description: AI prompt template to use
        required: true
        type: choice
        options:
          # BEGIN_PROMPT_TEMPLATES (auto-updated by the sync-todoist-projects workflow)
          - artist-interview-invite-email
          - task-enrichment
          # END_PROMPT_TEMPLATES
      task_title:
        description: 'Task title (required)'
        required: true
        type: string
      context:
        description: 'Background information or constraints (optional)'
        required: false
        type: string
      priority:
        description: 'Task priority'
        required: false
        type: choice
        options:
          - normal
          - medium
          - high
          - urgent
      project_name:
        description: Project name (leave blank to use the generated task title)
        required: false
        type: string
      is_favorite:
        description: Mark the project as a favourite
        required: false
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'

permissions: {}

jobs:
  create-project:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      models: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate content via GitHub Copilot and create Todoist project
        env:
          TODOIST_API_TOKEN: ${{ secrets.TODOIST_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMPT_TEMPLATE: ${{ inputs.prompt_template }}
          TASK_TITLE: ${{ inputs.task_title }}
          CONTEXT: ${{ inputs.context }}
          PRIORITY: ${{ inputs.priority || 'normal' }}
          PROJECT_NAME: ${{ inputs.project_name }}
          IS_FAVORITE: ${{ inputs.is_favorite }}
        run: python3 .github/scripts/run_prompt_template.py
