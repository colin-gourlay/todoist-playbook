name: Create Todoist Project via MCP

on:
  workflow_dispatch:
    inputs:
      template:
        description: CSV template to use
        required: false
        type: choice
        options:
          # BEGIN_CSV_TEMPLATES_MCP (auto-updated by the sync-todoist-projects workflow)
          - ''
          - album-of-the-week-weekly-review
          - code-review
          - daily-review
          - ef-code-review
          - exam-certification-workflow
          - house-admin
          - iteration-0
          - onboarding-checklist
          - one-on-one
          - radio-show-system
          - saas-spin-up
          - saas-wind-down
          - socials-health-and-optimization-checklist
          - weekly-review
          # END_CSV_TEMPLATES_MCP
      project_name:
        description: Project name (leave blank to use the template's default name)
        required: false
        type: string
      color:
        description: Project colour (leave blank to use the template or system default)
        required: false
        type: choice
        options:
          - ''
          - berry_red
          - red
          - orange
          - yellow
          - olive_green
          - lime_green
          - green
          - mint_green
          - teal
          - sky_blue
          - light_blue
          - blue
          - grape
          - violet
          - lavender
          - magenta
          - salmon
          - charcoal
          - grey
          - taupe
      is_favorite:
        description: Mark the project as a favourite
        required: false
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'

permissions: {}

jobs:
  create-project:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Todoist project via MCP server
        # Leaving template blank defaults to the 'weekly-review' CSV template.
        # Connects to https://ai.todoist.net/mcp using the MCP Streamable HTTP
        # transport; no additional dependencies are required beyond Python 3.
        env:
          TODOIST_API_TOKEN: ${{ secrets.TODOIST_API_TOKEN }}
          TEMPLATE: ${{ inputs.template || 'weekly-review' }}
          PROJECT_NAME: ${{ inputs.project_name }}
          PROJECT_COLOR: ${{ inputs.color }}
          IS_FAVORITE: ${{ inputs.is_favorite }}
        run: python3 .github/scripts/create_via_mcp.py
